# Week 3 Semantic Retrieval and Few-Shot Prompting - Implementation Specs

approach:
  summary: Extend the cuisine classifier with a ChromaDB vector store for semantic retrieval, using nomic-embed-text or fine-tuned mpnet to embed recipes and retrieve k=3 similar examples as few-shot context for the LLM prompt. Each embedding model has its own separate ChromaDB store.
  decisions:
    embedded_text:
      choice: ingredients + description combined (dish name excluded)
      reasoning: Dish name alone gives limited semantic signal; ingredients and description together capture the flavour profile and cooking style that distinguish cuisines. Dish name is stored as metadata for debugging, not embedded.
    metadata_fields:
      choice: dish name, id, ingredient count, cuisine type label, embedding model name, embedding timestamp
      reasoning: Label is needed to build the few-shot prompt. Dish name and id support retrieval debugging. Ingredient count is a lightweight domain signal. Embedding model and timestamp support future auditing and model upgrades.
    label_leak_exclusions:
      choice: cuisine type and country of origin excluded from embedded text
      reasoning: Both fields directly encode the answer being predicted — including them would leak the label into the embedding space.
    embedding_model:
      choice: nomic-embed-text (Ollama) or fine-tuned mpnet (local) — user selectable at runtime via Streamlit radio button
      reasoning: nomic-embed-text is immediately available via Ollama. Fine-tuned mpnet (models/ft-domain-embedding/cuisine_mpnet_ft) runs on CPU locally and has gap 0.558 on cuisine pairs. Each model gets its own separate ChromaDB store so embeddings are never mixed.
      label_note: True cuisine labels available in All_Recipe_Cuisine_Labeled_v2.csv (llm_cuisine column, 6,781 recipes). Labels generated by SOTA model. Distribution — American:3965, Other:1483, Italian:699, Mexican:424, Chinese:121, Indian:89. Class imbalance noted — F1 per class more informative than overall accuracy.
    chroma_client:
      choice: PersistentClient with skip-existing-ids logic, BATCH_SIZE=100, 200 recipes per populate.py run
      reasoning: 13,057 recipes would take significant time to re-embed from scratch each session. PersistentClient stores embeddings on disk; incremental batch embedding lets the student resume without re-processing already-stored documents.
    collection_names:
      nomic: cuisine_recipes (chroma_db/)
      mpnet: cuisine_recipes_mpnet (chroma_db_mpnet/)
    selection_strategy:
      choice: similarity-only, k=3
      reasoning: 6 cuisine classes are semantically well-separated (fine-tuned embedding gap 0.558), so top-3 nearest neighbours are likely from the correct cluster without needing label-aware forcing. k=3 chosen over k=5 due to GPU RAM limitation and quadratic attention cost with gemma2:2b.

tasks:
  task_1:
    name: Build retrieval/vector_store.py ChromaDB wrapper
    details: |
      - Create retrieval/vector_store.py at project root
      - Supports two backends via VectorStore(model=...) parameter:
          - "nomic-embed-text": uses ollama.embed, stored in retrieval/chroma_db/
          - "mpnet": uses fine-tuned SentenceTransformer (CPU), stored in retrieval/chroma_db_mpnet/
      - SentenceTransformer loaded once at __init__ to avoid reload on every query
      - TRANSFORMERS_VERBOSITY=error set before mpnet load to suppress noisy logs
      - Implement add(ids, texts, labels, metadata_list):
          - Check existing ids to skip already-stored documents
          - Embed texts in batches of 100 using _embed() (dispatches to correct backend)
          - Store with collection.add(ids, embeddings, documents, metadatas)
          - Metadata per document: dish_name, ingredient_count, cuisine_type, embedding_model, embedding_timestamp
      - Implement query(text, k=3):
          - Embed query text using _embed()
          - Call collection.query(query_embeddings, n_results=k)
          - Return list of dicts with: document, cuisine_type, dish_name, ingredient_count, distance

  task_2:
    name: Create retrieval/populate.py script
    details: |
      - Create retrieval/populate.py as a standalone script (not embedded in app or classifier)
      - Accepts --model flag: nomic-embed-text (default) or mpnet
      - Dataset: All_Recipe_Cuisine_Labeled_v2.csv (6,781 recipes with llm_cuisine labels)
      - Drop rows missing Description, Ingredients, or llm_cuisine
      - Embed and store 200 recipes per run — skips already-stored ids automatically
      - Re-run populate.py each time to add the next 200 recipes (incremental)
      - Embedded text = ingredients (pipe → comma) + description
      - Labels = llm_cuisine column (real cuisine type labels generated by SOTA model)
      - Metadata per recipe: dish_name (Name column), ingredient_count (derived from Ingredients split by |),
        cuisine_type (from llm_cuisine), embedding_model and embedding_timestamp added automatically by vector_store.add()
      - Prints current count, how many new recipes added, and how many remain after each run
      - Run with: uv run python retrieval/populate.py [--model mpnet]
      - Note: existing chroma_db/ stores must be cleared when switching datasets to avoid mixed labels
      - Current state: both stores populated with 600 labeled recipes (3 runs × 200) from All_Recipe_Cuisine_Labeled_v2.csv

  task_3:
    name: Update predict_cuisine() to support retrieval few-shot mode
    details: |
      - Add optional parameters: use_retrieval=False, vector_store=None to predict_cuisine()
      - Returns tuple (output, prompt, system_prompt, context_found) — all 4 values used by app.py
      - context_found: True if dataset lookup returned ingredients or description, False otherwise
      - Stage logging to terminal at each step (professional language, not verbose):
          [1/4] Dataset lookup: context retrieved / no context found
          [2/4] ChromaDB retrieval: N few-shot examples retrieved (model) / skipped — zero-shot mode
          [3/4] Sending prompt to {model_name}...
          [4/4] Response received — classification complete.
      - When use_retrieval=True and vector_store is not None:
          - Query text = ingredients + description; falls back to dish name only if context not found
          - Fetch k+1=4 candidates, filter out query dish by dish_name to avoid self-referencing, take top 3
          - Format retrieved examples into few-shot block prepended to user prompt
      - When use_retrieval=False: existing zero-shot behaviour unchanged

  task_4:
    name: Update Streamlit app with retrieval toggle and UI improvements
    details: |
      - st.checkbox("Look it up in the recipe dataset") — enables dataset context lookup
      - st.checkbox("Use retrieval-augmented few-shot") — enables ChromaDB retrieval
      - When retrieval enabled: st.radio to select embedding model (nomic-embed-text or mpnet)
      - Load matching VectorStore once at startup using st.cache_resource(model)
      - st.warning if selected vector store is empty with populate command
      - try/except around classify call — st.error with actual exception message on failure
      - st.info showing active mode after classify:
          - "dataset context" if dataset lookup succeeded
          - "dish name only (not found in dataset)" if lookup failed despite checkbox being on
          - "+ retrieval few-shot (model)" appended when retrieval is active
          - "zero-shot (dish name only)" when both checkboxes off
      - st.expander("Retrieved few-shot examples") showing dish_name → cuisine_type + distance
      - st.expander("Prompt sent to LLM") with st.code() for both system prompt and user prompt
      - .streamlit/config.toml with fileWatcherType=none to suppress torchvision warnings from transformers

  task_5:
    name: Design evaluate.py for cuisine classifier (execution deferred)
    details: |
      - Mirror pattern from src/baseline_recipe_classifier/evaluate.py
      - Two runs on same test sample: zero-shot vs retrieval few-shot (k=3)
      - Metrics: overall accuracy, per-class F1 score
      - Sample size: 20–50 recipes with ground truth cuisine labels
      - Per-class breakdown required — retrieval may help on ambiguous classes (Other) while neutral on obvious ones
      - Other class: inspect manually in addition to F1 (catch-all category)
      - Note: ground truth labels in progress — evaluation execution deferred to next week

integration_steps:
  - New file: retrieval/vector_store.py — ChromaDB wrapper supporting nomic-embed-text and mpnet backends; each model has its own chroma path and collection
  - New file: retrieval/populate.py — standalone script to embed 200 recipes per run; use --model flag to target nomic or mpnet store
  - New directories: retrieval/chroma_db/ (nomic), retrieval/chroma_db_mpnet/ (mpnet) — both in .gitignore
  - src/cuisine_classifier/__main__.py: add use_retrieval and vector_store params to predict_cuisine(); fetch k+1 results and filter out query dish to avoid self-referencing
  - app.py: dataset lookup checkbox; retrieval toggle checkbox; when retrieval enabled show radio to select nomic or mpnet; load matching VectorStore; show warning if selected store is empty; show retrieved examples in expander
  - Pipeline flow: embed query with selected model → retrieve k=3 from matching ChromaDB (excluding query dish) → build few-shot prompt → call LLM → return label

evaluation_plan:
  metrics: [accuracy, f1_per_class, manual_inspection_other]
  dataset_size: 20-50 recipes with ground truth cuisine labels
  baseline: zero-shot predict_cuisine() with no few-shot examples (current behaviour)

reference_materials:
  notebook: notebooks/week3_transformer_architecture.ipynb

success_criteria:
  minimum: vector_store.py runs without errors, ChromaDB is populated with at least 200 recipes, query() returns k=3 results with cuisine_type and dish_name, Streamlit retrieval toggle works and shows retrieved examples
  good: retrieval few-shot improves accuracy over zero-shot baseline on 20+ test recipes; per-class F1 shows improvement on at least one cuisine type; retrieved examples are semantically relevant to the query

todo:
  - Skip retrieval entirely when dataset context is not found (dish not in dataset). Currently falls
    back to querying ChromaDB with dish name only, which produces weak matches since stored embeddings
    were built from ingredients+description text — the query and document spaces don't align well.
    Proposed fix: in predict_cuisine(), set use_retrieval=False when context_found=False, and surface
    this as a note in the UI mode label.

verification:
  cli:
    - Run population script to embed recipes into ChromaDB — confirm collection.count() > 0
    - Run a test query: uv run python -c "from retrieval.vector_store import VectorStore; vs = VectorStore(); print(vs.query('zucchini cheese tortilla bell pepper', k=3))"
    - Confirm 3 results returned with cuisine_type and dish_name in each result
    - Run: uv run python -m cuisine_classifier "Vegetable Quesadillas" — confirm zero-shot mode still works
  streamlit:
    - Run: uv run streamlit run app.py
    - Open http://localhost:8501
    - Type "Vegetable Quesadillas", leave retrieval toggle OFF — confirm zero-shot result shows as before
    - Enable "Use retrieval-augmented few-shot" checkbox, click Classify
    - Confirm retrieved examples appear in expander and cuisine_type result is returned
    - Type "Borscht", enable retrieval — confirm cuisine_type=Other and retrieved examples are shown
